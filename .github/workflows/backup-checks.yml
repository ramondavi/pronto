name: Verificação da rotina de backup

on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup*.yml'
  push:
    branches: [master]
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup*.yml'

permissions:
  contents: read

jobs:
  synthetic-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar ferramentas
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y postgresql-client-17 age > /dev/null
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check -r scripts/backup/requirements.txt > /dev/null
      - name: Testar mudanças, falhas, criptografia e restauração sintética
        run: python -m unittest discover -s scripts/backup -p 'test_*.py' -v
        env:
          BACKUP_INTEGRATION: '1'
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: synthetic
          PGSSLMODE: disable
