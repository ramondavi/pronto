name: Verificações do projeto

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Testes, tipos, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar aplicação com resumo e logs completos
        run: npm run verify
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-build-validation

      - name: Preservar diagnóstico das verificações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: tmp/verification/
          retention-days: 7

      - name: Instalar Chromium para os testes públicos
        run: npx playwright install --with-deps chromium

      - name: Testar acessibilidade, temas e responsividade pública
        run: npm run test:e2e:public
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-browser-validation

  database:
    name: Migrações e testes do banco local
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências pelo lockfile
        run: npm ci --no-audit --no-fund

      - name: Iniciar Supabase local
        run: npx supabase start > /dev/null

      - name: Reaplicar migrações locais
        run: npx supabase db reset --local

      - name: Verificar banco local
        run: npx supabase db lint --local --level error

      - name: Executar testes pgTAP locais
        run: npx supabase test db --local

      - name: Desligar Supabase local
        if: always()
        continue-on-error: true
        run: npx supabase stop
