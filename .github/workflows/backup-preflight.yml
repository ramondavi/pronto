name: Verificação manual dos acessos de backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  preflight:
    # Manual only; may check access before enabling the daily backup schedule.
    if: github.ref == 'refs/heads/master'
    environment: backup-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Preparar ferramentas
        run: |
          sudo apt-get install -y age > /dev/null
          python -m pip install --disable-pip-version-check -r scripts/backup/requirements.txt > /dev/null
      - name: Conferir somente acesso e configurações
        run: python scripts/backup/preflight.py
        env:
          PGHOST: ${{ secrets.BACKUP_PG_HOST }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: ${{ secrets.BACKUP_PG_USER }}
          PGPASSWORD: ${{ secrets.BACKUP_PG_PASSWORD }}
          PGSSLMODE: verify-full
          PGSSLROOTCERT: system
          BACKUP_PG_CA_CERT: ${{ secrets.BACKUP_PG_CA_CERT }}
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=300000 -c timezone=UTC'
          BACKUP_SOURCE_ID: pronto-production
          SUPABASE_URL: ${{ vars.BACKUP_SUPABASE_URL }}
          BACKUP_STORAGE_READ_TOKEN: ${{ secrets.BACKUP_STORAGE_READ_TOKEN }}
          B2_ENDPOINT: ${{ vars.BACKUP_B2_ENDPOINT }}
          B2_REGION: ${{ vars.BACKUP_B2_REGION }}
          B2_BUCKET: ${{ vars.BACKUP_B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.BACKUP_B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.BACKUP_B2_APPLICATION_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
